# Explicit rule selection so a ruff upgrade can't silently change what "clean"
# means for this repo again. Before this file existed, CI had no config at
# all; a routine `pip install` pulled a newer ruff whose expanded default
# rule set found 44 pre-existing findings overnight, unrelated to whatever
# change happened to be in flight at the time (docs/DECISIONS.md, 2026-07-17
# DB-bloat entry).
[lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "RUF", "ISC", "EXE"]
ignore = [
    # BLE001 (no blind `except Exception`): used deliberately throughout
    # service/ingestion.py and service/orchestrator.py to turn any failure
    # into a recorded failed-run row (CLAUDE.md rule 5 -- fail loudly, but
    # into the audit trail, not an uncaught crash) rather than enumerating
    # every possible provider/network/parsing exception type.
    "BLE001",
    # DTZ011 (no naive `date.today()`): this project's dates are trading
    # calendar dates, not timezone-aware instants -- there is no multi-
    # timezone requirement here that would justify the added complexity.
    "DTZ011",
]
